name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          # driftpy/solana deps are optional (the watcher falls back to the
          # synthetic feed without them) — skip them here to keep CI fast and
          # independent of Solana RPC/network access.
          pip install python-dotenv

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest tests/ -v

      - name: Algorithmic self-test
        run: python main.py --selftest
